[tool.poetry]
name = "synthetic-omop-analysis"
version = "0.1.0"
description = "poetry environment for omop analysis"
authors = ["hjombach <hendrik.ombach@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^3.0.6"
numpy = "<2.5"
matplotlib = "^3.11.2"
jupyter = "^1.1.1"
ipykernel = "^7.4.0"
google-cloud-bigquery = "^3.46.1"
seaborn = "^0.13.2"
db-dtypes = "^1.7.2"
google-cloud-bigquery-storage = "^2.42.0"
datetime = "^6.0"
plotly = "^7.1.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
